name: OpsPulse CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore OpsPulse.slnx
      - run: dotnet build OpsPulse.slnx -c Release --no-restore
      - run: dotnet test backend/OpsPulse.Tests -c Release --no-build --collect:"XPlat Code Coverage" --results-directory artifacts/test-results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: artifacts/test-results
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start local API
        run: |
          dotnet run --project backend/OpsPulse.Api --no-launch-profile > /tmp/opspulse-api.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://localhost:5080/health; then exit 0; fi
            sleep 2
          done
          cat /tmp/opspulse-api.log
          exit 1
        env:
          ASPNETCORE_URLS: http://127.0.0.1:5080
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results
  docker:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - run: docker build --tag opspulse-api:ci --file backend/OpsPulse.Api/Dockerfile .
